# One service, one published port — the one lab.conf's HEALTH names — and its state under
# its own data folder, which the platform gives it as ${APPDATA} (/srv/appdata/<its name>), so
# nothing here names it. The platform adds its own file beside this one at every deploy (no
# capabilities, no new privileges, a walled network) and refuses anything its policy does not
# know: privileged, cap_add, devices, host networking, binds outside its data folder, secrets and
# configs read from the host.
services:
  app:
    build: .
    ports: ["8898:8000"]                      # 8898: the port the platform's owner gave you
    volumes: ["${APPDATA}/data:/data"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
